kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: securesme-cluster
nodes:
- role: control-plane
  # CRITICAL: We mount the host laptop's kernel headers into the K8s Node
  # so the eBPF compiler (BCC) can map system calls correctly.
  extraMounts:
  - hostPath: /lib/modules
    containerPath: /lib/modules
    readOnly: true
  - hostPath: /usr/src
    containerPath: /usr/src
    readOnly: true
  - hostPath: /sys/kernel/debug
    containerPath: /sys/kernel/debug
