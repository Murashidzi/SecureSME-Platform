name: SecureSME Security Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  security-check:
    runs-on: ubuntu-latest

    steps:
    # 1. Get the code
    - uses: actions/checkout@v3

    # 2. Set up Python
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    # 3. Install Security Tools
    - name: Install Bandit & Safety
      run: |
        pip install bandit safety

    # 4. Run Bandit (Scans your Python code for security flaws)
    - name: Run Bandit Analysis
      # -r: recursive (scan all folders)
      # -ll: log level (show only medium/high severity)
      run: bandit -r services/auth-service/app -ll

    # 5. Run Safety (Scans your dependencies for known hacks)
    - name: Check Dependencies for Vulnerabilities
      run: safety check -r services/auth-service/requirements.txt
