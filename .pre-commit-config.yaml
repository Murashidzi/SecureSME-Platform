repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
     - id: trailing-whitespace
     - id: end-of-file-fixer
     - id: check-yaml
     - id: check-added-large-files
     - id: detect-private-key # Blocks SSH keys

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.7
    hooks:
      - id: bandit
        args: ["-r", "services/auth-service"]
        exclude: ^.venv/
        description: "Python SAST: Scans for common security issues"

  # Cloud Security Specific: Prevents leaking AWS keys
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
     - id: detect-aws-credentials
       args: [--allow-missing-credentials]
